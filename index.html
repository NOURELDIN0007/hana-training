<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#352534"><title>Hana’s assessment studio</title><style>
:root{--ink:#302630;--green:#633c56;--mint:#eee3e9;--line:#dfd4cd;--paper:#f6f1ea;--orange:#a77959}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,'Segoe UI',sans-serif}header{background:var(--ink);color:#fff;padding:22px max(5vw,calc((100vw - 1060px)/2));white-space:nowrap}header strong{font:600 21px Georgia,serif}header span{float:right;font-size:14px;color:#d5e6d7}main,nav{max-width:1060px;margin:auto}nav{display:flex;gap:6px;overflow:auto;padding:14px 0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap}main{padding:28px 0 72px}h1,h2,h3{line-height:1.15}h1{font:normal clamp(36px,5vw,64px)/1.02 Georgia,serif;margin:4px 0 20px}h2{font:normal 29px/1.2 Georgia,serif;margin:26px 0 12px}h3{font-size:18px}p{max-width:78ch}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:6px;cursor:pointer}button:hover,summary:hover{border-color:var(--green);background:#f3eaf0}button.active,button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{cursor:default;opacity:.58}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #925471;outline-offset:3px}a{color:var(--green);font-weight:600}.hero{background:var(--mint);border-left:6px solid var(--green);padding:clamp(20px,4vw,43px);border-radius:4px}.hero p{max-width:65ch}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:12px}.card,article,details.box{padding:20px;background:#fff;border:1px solid var(--line);border-radius:8px}.card{display:flex;flex-direction:column;align-items:flex-start}.card p{flex:1}.card h3{margin:5px 0}.eyebrow,small{font-size:13px;color:#705666}.eyebrow{font-weight:700;letter-spacing:.08em;text-transform:uppercase}.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:15px 0}.choice{display:block;text-align:left;margin:8px 0;width:100%}.choice[aria-pressed=true]{background:#eee3e9;border:2px solid var(--green)}.feedback{border-left:4px solid var(--orange);padding:10px 14px;background:#f5eadd}.time{font-variant-numeric:tabular-nums;font-weight:700}.box{margin:10px 0}summary{cursor:pointer;font-weight:650}textarea{width:100%;min-height:118px;padding:12px;border:1px solid var(--line);border-radius:5px}li{margin-bottom:7px}label{display:block}.muted{color:#695d62}.module{min-height:160px}.meter{height:6px;background:#e4d7de;border-radius:5px;margin:12px 0}.meter i{display:block;height:100%;background:#80546d;border-radius:5px}footer{margin-top:36px;border-top:1px solid var(--line);padding-top:12px;color:#675b62;font-size:13px}@media(max-width:1140px){main,nav{margin-left:5vw;margin-right:5vw}}@media(max-width:560px){header span{display:none}main{padding-top:18px}article,.card{padding:15px}}
</style><link rel="stylesheet" href="studio.css?palette=atelier"></head><body><header><strong>Hana’s assessment studio</strong><span>Global Talent Program · 2026</span></header><nav aria-label="Study sections" id="nav"></nav><main><section id="page"></section><footer>Independent practice for the Global Hassan Allam Talent Program. Progress is stored in this browser when available.</footer></main><script>const groups=[["Grammar","English","Find the subject and the time clue before choosing a verb. In “Each of the reports was checked,” each is singular. Use the past simple with a finished time and the present perfect for a period continuing to now.",[["Each of the supplier invoices ___ a purchase order number.","has","have","having","Each is singular, even when the following noun is plural."],["We ___ the forecast yesterday afternoon.","revised","have revised","revise","Yesterday marks a completed past time."],["If the documents arrive today, we ___ the checks tomorrow.","will finish","would have finished","finished","A realistic future condition uses if + present, then will + verb."],["By the time Finance called, the branch ___ the transfer.","had processed","will process","processes","The past perfect places processing before the past phone call."],["We have worked with this supplier ___ 2023.","since","for","during","Since introduces the starting point. For introduces a duration."],["The director requested that the summary ___ before noon.","be sent","is sending","sent","After requested that, the formal passive form is be + past participle."]]],["Workplace vocabulary","English","Use the sentence around an unfamiliar word. Pending verification means action waits for a check. Pay attention to differences such as by Friday (deadline) and from Friday (start).",[["The supplier waived the fee. What happened?","The supplier gave up its claim to the fee.","The supplier doubled the fee.","The supplier delayed billing the fee.","Waive means give up a right or charge."],["‘Please reconcile the two statements.’ What action is requested?","Compare entries and explain differences.","Combine balances without checking.","Approve both statements.","Reconciliation identifies and accounts for differences."],["The figures are provisional. Which description fits?","They may change after further checks.","They have final approval.","They must be wrong.","Provisional means temporary or subject to confirmation."],["The deadline was brought forward from Thursday to Tuesday. How did it change?","It is two days earlier.","It is two days later.","Only the meeting venue changed.","Bring forward moves an event earlier."],["Choose the clearest polite request.","Could you send the signed copy by noon?","You have failed as usual.","Deal with it soon.","A specific action and deadline reduce ambiguity."]]],["Reading & inference","English","Read the question before the passage. Separate required actions from optional ones. For inference questions, use only what the passage establishes.",[["Memo: Send revised totals by noon. Teams with unchanged totals should acknowledge receipt by 3 pm. Your totals are unchanged. What must you do?","Acknowledge by 3 pm.","Send revised totals by noon.","Take no action.","The second sentence gives a separate instruction to teams with unchanged totals."],["Updates received after Tuesday are included in next week’s report unless the controller approves an exception. A Wednesday update has no exception. Where does it go?","Next week’s report.","This week’s report.","Neither report.","The default rule applies because the condition for an exception is absent."],["The branch introduced an appointment system in March. Waiting times fell in April. What does the text establish?","The decrease followed the introduction.","The system caused the decrease.","Every customer waited less.","Chronological order alone does not establish cause or a result for every customer."],["A memo calls the pilot ‘encouraging’ and requests another month of data before expansion. What is the writer’s position?","Cautiously positive.","Committed to immediate expansion.","Opposed to collecting more data.","The positive description is qualified by the request for more evidence."],["A notice says ‘All staff may attend. Department leads must register.’ Which statement follows?","Department leads have a registration requirement.","Only department leads may attend.","All staff must attend.","May permits attendance and must imposes a duty on leads."]]],["Listening","English","Listen once for the purpose and again for numbers, corrections, and next actions. Play each message before viewing its transcript. If audio is unavailable on your device, ask someone to read the transcript aloud.",[["When is the revised meeting?","Thursday at 10:30.","Tuesday at 10:30.","Thursday at 10:00.","The speaker corrects the day and confirms half past ten.","We planned to meet on Tuesday at ten. The client has requested Thursday instead. Please move the review to half past ten on Thursday."],["What should you send first?","The signed delivery note.","The entire invoice pack.","The original contract.","The note is needed today. The remaining documents can follow.","Before you send the full invoice pack, could you email the signed delivery note? The rest can wait until tomorrow."],["How much remains to be collected?","15,000 pounds.","50,000 pounds.","35,000 pounds.","Fifty thousand minus thirty-five thousand equals fifteen thousand.","We invoiced fifty thousand pounds. Thirty-five thousand has reached the account. Can you follow up on the balance?"],["Who will call the vendor?","Mona.","Omar.","The listener.","Mona explicitly takes responsibility for the call.","Omar, thanks for checking the schedule. This is Mona. I will call the vendor myself. Please update the delivery tracker after I call."]]],["Numerical reasoning","Ability","Write down the denominator first. Percentage change = (new − old) ÷ old × 100. To combine rates, add quantities before dividing. Check units and estimate before using the calculator.",[["A budget is EGP 320,000. Actual spending is EGP 344,000. By what percentage is spending over budget?","7.5%","6.98%","24%","24,000 ÷ 320,000 × 100 = 7.5%."],["Office A collected 80 of 100 invoices. B collected 90 of 150. What is the combined collection rate?","68%","70%","85%","170 ÷ 250 = 68%. Weight by invoice counts."],["An invoice of EGP 15,000 receives a 10% discount and then a 5% charge on the discounted price. Find the total.","EGP 14,175","EGP 14,250","EGP 13,500","15,000 × 0.90 × 1.05 = 14,175."],["Six staff process 180 files in five hours. At the same rate, how many can four staff process in three hours?","72","108","120","180 ÷ 30 staff-hours = 6 per staff-hour. Multiply by 12."],["A completion rate rises from 60% to 75%. What is the relative increase?","25%","15%","20%","15 percentage points ÷ 60% = 25% relative growth."],["Collections (EGP thousands): East 80 → 96, West 60 → 78, North 100 → 120. Which region grew fastest in percentage terms?","West","North","East","West grew 30%. East and North each grew 20%."]]],["Logical reasoning","Ability","Distinguish must be true from could be true. If A implies B, the absence of B rules out A. The presence of B does not prove A. For patterns, test changes, alternating rules and repetitions.",[["Every released payment was approved. This payment has no approval. What follows?","It was not released.","It was released.","It must be fraudulent.","With approval required, an unapproved payment cannot be released."],["Every auditor uses the portal. Sam uses the portal. Must Sam be an auditor?","No, other users may exist.","Yes, necessarily.","Only if the portal is online.","The rule tells you what auditors do, not who else uses the portal."],["Continue using the same difference pattern: 3, 7, 13, 21, 31, …","43","41","45","The increments are 4, 6, 8, 10 and then 12."],["Two sequences alternate: 2, 20, 4, 17, 6, 14, …","8","11","12","Odd positions rise by 2. Even positions fall by 3. The seventh position is odd."],["A symbol rotates 90° clockwise at each step: ↑, →, ↓, …","←","↑","→","The next clockwise turn from down points left."],["Some trainees are accountants. All accountants study reporting. Which conclusion is certain?","Some trainees study reporting.","All trainees are accountants.","All reporting students are trainees.","At least the trainees who are accountants study reporting."]]],["Critical thinking","Ability","Identify the exact claim and its evidence. Test competing explanations, sampling bias, missing denominators, and the difference between a forecast and an observation.",[["Late invoices fell after a reminder system launched. Which comparison best tests whether reminders helped?","Comparable accounts with and without reminders during the same period.","The logo of the reminder system.","One enthusiastic comment.","Comparable groups help separate the reminder effect from other changes."],["Twenty volunteers from a 500-person office liked a new policy. Which conclusion is supported?","These twenty volunteers liked it.","Most employees liked it.","Exactly 4% of employees liked it.","The preferences of nonrespondents are unknown."],["‘We can fund the upgrade entirely from next month’s receipts.’ Which assumption matters most?","Enough receipts will arrive before payment is due.","The office uses one supplier.","All receipts will be in cash notes.","Total expected income may not be available on the payment date."],["Project A had twice as many errors as B. What else is needed to compare error rates?","How many items each project processed.","Their team names.","Their office addresses.","An error rate requires errors divided by exposure."],["A forecast projects lower costs. Which evidence would most weaken it?","A newly signed contract raises the largest input cost above the forecast assumption.","The chart uses two colors.","An unrelated team changed offices.","The contract challenges a material input directly."]]],["Analytical thinking","Ability","Turn rules into a small diagram or table. Write fixed positions first, group adjacent items together, and test one remaining constraint at a time.",[["Four tasks fill four slots. Check precedes Pay. File immediately follows Pay. Log is last. What is first?","Check","Pay","File","Pay–File must occupy slots two and three, leaving Check first."],["Mona can work Mon or Wed. Karim can work Tue or Wed. A joint one-day review must include both. Which day works?","Wednesday","Tuesday","Monday","Wednesday is the intersection of their availability."],["Ledger rows (ID, amount): A17 540, B71 450, C20 900. Receipt rows: A17 540, B17 450, C20 900. Which field differs?","Middle ID","Middle amount","Last amount","B71 and B17 transpose the digits. The amounts match."],["A report needs 4 hours for data collection, then two parallel checks lasting 3 and 5 hours. Final sign-off takes 1 hour after both. Earliest finish?","10 hours","13 hours","8 hours","4 + max(3,5) + 1 = 10 hours."],["Only bids costing at most EGP 90k and delivered within 6 weeks qualify. A: 88k/7 weeks. B: 90k/6 weeks. C: 91k/4 weeks. Which qualifies?","B","A","C","B satisfies both inclusive limits. A misses time and C misses cost."]]],["Workplace judgment","Psychometric","If a question asks for an action, identify the risk, your authority and the person who can resolve it. The examples here give reasoning for fictional scenarios. The Academy has not specified this format.",[["A supplier claims its bank details have changed and requests immediate payment. What is the strongest first response?","Verify through the established independent channel before payment.","Use the new details because the email is urgent.","Send a small test payment without approval.","Independent verification helps protect funds and follows a controlled process."],["Two managers set conflicting deadlines. You cannot meet both. What should you do first?","Explain the conflict early and agree priorities with them.","Silently choose the easier task.","Promise both and report delays afterward.","Make the tradeoff visible while the plan can still be adjusted."],["You discover an error after emailing a report. What is the most constructive response?","Notify recipients promptly, explain the impact, and issue a corrected version.","Replace the file silently.","Wait to see if someone notices.","Recipients may already be relying on the incorrect figures."],["A teammate asks you to share customer IDs in a large group chat to save time. What should you do?","Use the approved restricted channel and share only the necessary information.","Post the whole file and delete it later.","Send it through a personal account.","Restricting access protects customers while allowing the work to progress."]]]],lab=[["Email writing","A supplier’s invoice is missing its purchase order number. Write 45–70 words asking for the missing detail. Explain why it matters and request a reply by Thursday.","Does the reader know exactly what to send?|Have you explained the reason without blaming anyone?|Is Thursday explicit and the tone polite?","Dear Salma, thank you for sending the invoice. Could you send the purchase order number by Thursday so I can match it to our records? Once I have it, I can pass the invoice to the team for verification. Thank you for your help."],["Summarizing figures","Write a two-sentence update. EGP 800,000 was due in October, EGP 680,000 was collected and the target was 90%. Explain the result and the next action.","Did you calculate the actual 85% rate?|Did you correctly describe a five-percentage-point gap?|Did you identify a practical action?","We collected EGP 680,000 of the EGP 800,000 due in October, reaching 85% against a 90% target. I will review the outstanding EGP 120,000 by due date and follow up on the oldest invoices first."],["Editing for clarity","Rewrite this message in two professional sentences. “The figures is different and nobody send me the final sheet yesterday so I can't tell which one are correct.”","Check agreement between subject and verb.|Use the past simple with yesterday.|Ask for the missing document without assigning blame.","The figures differ, and I did not receive the final sheet yesterday. Could you send the approved version so I can verify the totals?"],["Spoken introduction","Give yourself 30 seconds to plan and 60 seconds to speak aloud. Introduce your background, give one specific example, and explain what you would like to learn in a rotation.","Did you answer all three parts?|Did you identify your own contribution accurately?|Could a listener follow you without seeing your CV?","Use a real example from university, banking or accounting training. Explain the task in plain English and end with one skill you want to develop. Repeat once, removing any phrase you would not normally say."],["Explaining a decision aloud","Take 60–90 seconds to explain how you would handle two spreadsheets with different balances. Imagine explaining your steps to a teammate outside Finance.","Did you name the first check?|Did you give the checks in a logical order?|Did you explain when you would involve another person?","One approach is to confirm the reporting date and account, compare transactions, isolate missing or duplicated entries, then ask the owner to verify unresolved differences. Explain why each step matters."],["Work-style rating","Rate ‘I usually check ambiguous instructions before acting’ from 1 (rarely) to 5 (almost always). Think of one recent example and one exception.","Did you answer for your typical behavior?|Can you recall a specific example?|Did you read the direction of the scale correctly?","There is no correct rating. Use the same frame of reference across similar questions and pay attention if the scale direction changes."],["Forced-choice preferences","Which sounds more like you on a typical group project: ‘I enjoy setting the timetable’ or ‘I enjoy spotting inconsistencies’? Pick one and explain it with a real example.","Choose what is comparatively more typical.|Think about behavior over several projects.|Distinguish preference from what you can do when asked.","Both preferences can support a team. If the real instructions ask for most and least like you, follow the requested ordering."],["Judgment and self-description","Consider ‘I stay calm under deadline pressure’ and ‘What would you do if the team might miss a deadline?’ Answer both in your own words.","Did you describe your behavior for the first?|Did you propose an action for the second?|Did you consider when a colleague needs an update?","The first asks you to reflect. The second asks for a decision. One possible action is to identify the blocked work, tell the lead early and propose a revised priority."]],brief="<h1>Exam briefing</h1><article><h2>What happens this week</h2><p>The November 19 Academy invitation confirms three separate online assessments. Expect three messages from “Assessment Talent Management” on Sunday, November 22. Each contains one link. Check junk mail. Complete and submit all three by Sunday, November 29, 2026, end of day. Each allows one attempt. Have a calculator, pen and notepad ready for Ability.</p><p>The invitation lists English, Psychometric and Ability. It explicitly names logical, numerical, critical and analytical thinking within Ability. It gives no exact cutoff time or time zone.</p></article><h2>Which formats will appear?</h2><div class=\"grid\"><article><h3>Multiple choice and typing</h3><p>The invitation gives no response format. Selected answers are useful practice for reasoning. Whether Hana will select options, type figures, write an email or complete an essay is unconfirmed.</p></article><article><h3>Speaking, video and monitoring</h3><p>No public source located establishes a live call, recorded answers, listening section, or webcam monitoring for this online round. These are different features. A request for camera access alone would not establish that spoken answers are required.</p></article><article><h3>Scoring and timing</h3><p>The vendor, time limits, item counts, pass marks, negative marking, navigation, device rules and language components remain unverified. “Assessment Talent Management” is the sender label. The Microsoft Forms link in the announcement collected applications.</p></article></div><h2>Evidence from earlier rounds</h2><article><p><b>Employer and recruiting team.</b> Hassan Allam Holding described several months of assessments and interviews for Batch 7. A recruiting-team account described online assessments followed by face-to-face group assessments, individual interviews and senior-management interviews. Those accounts establish the order for that cohort only. <a href=\"https://www.linkedin.com/posts/hassan-allam-holding_hassanallamholding-talentprogram-batch7-activity-7353348104198250497-Uo1R\">Holding’s Batch 7 announcement</a> · <a href=\"https://eg.linkedin.com/in/lama-aly\">Recruiter account shared on LinkedIn</a></p><p><b>Candidate experience.</b> Mohamed Mahran independently described the same progression. An older Arabic post shared an applicant’s account of an English assessment and a reported B1.3 result. The post gives no general cutoff or verified question format. <a href=\"https://eg.linkedin.com/in/mohamed-mahran-mba-clac\">Candidate’s account</a> · <a href=\"https://www.linkedin.com/posts/michaelrizkallaeit_%D9%88%D8%A7%D8%B3%D8%B7%D8%A9-activity-6910531932288167936-MUhp\">Arabic account</a></p><p>A public YouTube walkthrough covers the earlier Batch 7 application form. It provides no evidence about Hana’s test screen. Searches across publicly indexed Facebook, Reddit and YouTube material did not identify a verifiable walkthrough for this November round. <a href=\"https://www.youtube.com/watch?v=1qxpsIbup70\">Batch 7 application walkthrough</a></p></article><h2>When the three emails arrive</h2><ol><li>For each message, look for the platform name, test title, expected duration, supported browser and device requirements before pressing Start.</li><li>Look separately for instructions about webcam monitoring, microphone recording, speaking, listening and typed responses. Check the examples, navigation rules and when the timer begins.</li><li>Keep the completion confirmation for each assessment. If a message is missing or a technical problem occurs, use the Academy WhatsApp number in your invitation.</li></ol><details class=\"box\"><summary>A question to ask the Academy if the invitations leave the format unclear</summary><p>Hello, I was shortlisted for the 2026 Global Talent Program. Could you confirm the time limit for each online assessment, whether the English test includes listening, typed writing or recorded speaking, and whether any test requires a webcam or microphone? Could you also confirm the deadline time zone? Thank you.</p></details><h2>Company and program</h2><p>Hassan Allam Holding works in engineering, construction, investment and development. The announcement Hana applied through invited Engineering and Business graduates in Egypt, Saudi Arabia, the UAE, Oman and Jordan, with applications in the country of nationality and residence. Its graduate program uses rotations. For a company example, Legacy’s concession at the Grand Egyptian Museum covers operation and services. A finance graduate could explore how the operator forecasts receipts and budgets long-term costs. <a href=\"https://www.hassanallam.com/about-us\">Company overview</a> · <a href=\"https://www.hassanallam.com/careers\">Graduate careers</a> · <a href=\"https://www.hassanallam.com/projects/grand-egyptian-museum\">Museum project</a></p><h2>Further practice</h2><p>Use the British Council for levelled language practice and SHL for examples of common employment assessments. These links do not identify the Academy’s provider or required English level.</p><div class=\"bar\"><a href=\"https://learnenglish.britishcouncil.org/free-resources/reading/b2\">Reading</a> · <a href=\"https://learnenglish.britishcouncil.org/skills/listening\">Listening</a> · <a href=\"https://learnenglish.britishcouncil.org/skills/writing\">Writing</a> · <a href=\"https://www.shl.com/shldirect/en/example-questions/\">Reasoning examples</a> · <a href=\"https://www.shl.com/shldirect/en/practice-tests/\">Full practice tests</a></div>";
</script><script src="question-bank.js"></script><script src="studio.js"></script></body></html>
